apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: my-workout
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/jalju0804/my-home-server.git
    targetRevision: main
    path: my-workout/app
  destination:
    server: https://kubernetes.default.svc
    namespace: my-workout
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
