apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-workout
spec:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: my-workout
  template:
    metadata:
      labels:
        app.kubernetes.io/name: my-workout
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: ghcr.io/jalju0804/my-workout:pending-first-build
          command: [python, manage.py, prepare_deployment]
          envFrom:
            - configMapRef:
                name: my-workout
            - secretRef:
                name: my-workout
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: backups, mountPath: /backups}
            - {name: tmp, mountPath: /tmp}
      containers:
        - name: app
          image: ghcr.io/jalju0804/my-workout:pending-first-build
          ports:
            - {name: http, containerPort: 8000}
          envFrom:
            - configMapRef:
                name: my-workout
            - secretRef:
                name: my-workout
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /healthz/
              port: http
              httpHeaders: [{name: Host, value: localhost}]
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz/
              port: http
              httpHeaders: [{name: Host, value: localhost}]
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz/
              port: http
              httpHeaders: [{name: Host, value: localhost}]
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 384Mi}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: backups, mountPath: /backups}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: my-workout-data}
        - name: backups
          persistentVolumeClaim: {claimName: my-workout-backups}
        - name: tmp
          emptyDir: {}
